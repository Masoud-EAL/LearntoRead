<!-- generated by tools/build-links.py — do not edit by hand.
     A short, shareable address: https://wordlink.au/test-listening lands straight on

<title>Test Yourself — Listening | WordLink</title>
<meta name="description" content="10 rounds of 3 questions, drawn from every listening game. It gets harder or easier as you go. Free English practice for adult learners. No sign-up.">
<!-- Self-referential: this short address IS the public address for
     Test Yourself — Listening now — it is what gets shared and what a link preview reads. A
     canonical pointing back at the app would hand every one of these pages
     the app's own single title and description, which is exactly the problem
     they exist to solve. -->
<link rel="canonical" href="https://wordlink.au/test-listening">

<meta property="og:type" content="website">
<meta property="og:site_name" content="WordLink">

<meta property="og:image" content="https://wordlink.au/icon-512.png">
<meta name="twitter:card" content="summary">

<!-- The refresh is the fallback for a browser with JavaScript turned off, and
     it lives in <noscript> so it is the script OR the meta, never both: left
     bare, the meta fires a second navigation on top of the script's and the
     destination is re-parsed from scratch part-way through loading.
     replace() so Back returns to wherever the link was shared, not to this
     staging post. Anything after the ? comes along, so /test-listening?q=20 works. -->
<noscript><meta http-equiv="refresh" content="0; url=game.html?mode=solo&amp;game=test:listening"></noscript>
<script>
(function(){
  var q=location.search.replace(/^\?/,'');
  location.replace('game.html?mode=solo&game=test:listening'+(q?'&'+q:''));
})();
</script>
