<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A bus-stop flag on a pole: side-on bus over a route-number strip.
       Australian stop flags differ by state operator, so this keeps to the
       form they share rather than imitating any one authority's branding.
       The previous version read as a train, being drawn front-on. -->
  <!-- pole -->
  <rect x="45" y="62" width="9" height="34" fill="#8a949e"/>
  <!-- sign panel -->
  <rect x="13" y="5" width="74" height="60" rx="6" fill="#1a4f8a"/>
  <!-- bus body, side view: slanted windscreen at the front (right) -->
  <path d="M22,20 L66,20 Q75,20 78,28 L78,44 L22,44 Z" fill="#fff"/>
  <!-- side windows -->
  <rect x="27" y="24" width="12" height="10" rx="2" fill="#1a4f8a"/>
  <rect x="42" y="24" width="12" height="10" rx="2" fill="#1a4f8a"/>
  <!-- windscreen -->
  <path d="M57,24 L66,24 Q71,24 73,30 L73,34 L57,34 Z" fill="#1a4f8a"/>
  <!-- wheels -->
  <circle cx="34" cy="45" r="6.5" fill="#fff" stroke="#1a4f8a" stroke-width="3"/>
  <circle cx="67" cy="45" r="6.5" fill="#fff" stroke="#1a4f8a" stroke-width="3"/>
  <!-- route-number strip -->
  <rect x="22" y="53" width="56" height="7" rx="3" fill="#fff" opacity=".85"/>
</svg>
