<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 100">
  <!-- A bus-stop flag on a pole: a front-on bus over the white route-number
       panel. An earlier version was drawn front-on, read as a train, and was
       turned side-on for it; the fault was the missing windscreen and lights,
       not the angle, so it is front-on again with both.

       Australian stop flags differ by state operator, so this keeps to the
       form they share rather than imitating any one authority's branding.
       The pole is a stub: .sign-pic fixes the height and lets the width
       follow, so every pixel spent on pole is taken off the flag.

       No lettering, and the route panel is left blank. Every other sign in
       this bank is wordless on purpose: a sign that carries its own answer in
       text is answered by matching letter shapes, which is a different task
       from reading the sign. -->
  <rect x="4" y="2" width="12" height="96" rx="3" fill="#8a949e"/>
  <rect x="12" y="4" width="90" height="92" rx="9" fill="#fff"/>
  <rect x="15" y="7" width="84" height="86" rx="6.5" fill="#0d5bb5"/>
  <!-- bus, front on: windscreen and headlights are what stop it reading as a train -->
  <rect x="34" y="14" width="46" height="45" rx="8" fill="#fff"/>
  <rect x="40" y="21" width="34" height="15" rx="3.5" fill="#0d5bb5"/>
  <rect x="40" y="43" width="9.5" height="6" rx="2.4" fill="#0d5bb5"/>
  <rect x="64.5" y="43" width="9.5" height="6" rx="2.4" fill="#0d5bb5"/>
  <rect x="36" y="59" width="11" height="5.5" rx="2.2" fill="#fff"/>
  <rect x="67" y="59" width="11" height="5.5" rx="2.2" fill="#fff"/>
  <!-- route-number panel -->
  <rect x="26" y="70" width="62" height="16" rx="3.5" fill="#fff"/>
</svg>
