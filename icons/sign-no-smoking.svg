<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The prohibition band runs from upper left to lower right. That is the
       way ISO 7010 and AS 1319 draw it, and it is the way it appears on every
       one of these signs in the street. The three ring signs here had it the
       other way round, all three, because the decision was written out once
       per file. -->
  <rect x="2" y="2" width="96" height="96" rx="11" fill="#fff" stroke="#c9ced4" stroke-width="2"/>
  <!-- smoke, rising from the lit end -->
  <g fill="none" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round">
    <path d="M33,43 q-6,-7 0,-13 q6,-6 0,-12"/>
    <path d="M43,41 q-6,-6 0,-11 q6,-5 0,-10"/>
  </g>
  <!-- cigarette, filter at the right -->
  <rect x="24" y="46" width="34" height="10" rx="1.5" fill="#1a1a1a"/>
  <rect x="58" y="46" width="14" height="10" rx="1.5" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="63" y1="47" x2="63" y2="55" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="67.5" y1="47" x2="67.5" y2="55" stroke="#1a1a1a" stroke-width="1.6"/>
  <circle cx="50" cy="50" r="37" fill="none" stroke="#e11b22" stroke-width="9.5"/>
  <line x1="23.8" y1="23.8" x2="76.2" y2="76.2" stroke="#e11b22" stroke-width="9.5" stroke-linecap="butt"/>
</svg>
