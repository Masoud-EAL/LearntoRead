<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Crew-neck knit jumper. Sleeves hang down beside the body rather than
       flaring out — that, the ribbed cuffs and the thick hem band are what
       stop it reading as the t-shirt emoji used for "shirt". -->
  <path d="M33,22 Q50,36 67,22 L80,26 L93,70 L77,78 L70,50 L70,88 L30,88 L30,50 L23,78 L7,70 L20,26 Z"
        fill="#c0392b" stroke="#7b241c" stroke-width="4" stroke-linejoin="round"/>
  <!-- ribbed hem -->
  <rect x="30" y="79" width="40" height="9" fill="#96281b"/>
  <!-- ribbed cuffs -->
  <path d="M80,64 L93,70 L77,78 L74,71 Z" fill="#96281b" stroke="#7b241c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M20,64 L7,70 L23,78 L26,71 Z" fill="#96281b" stroke="#7b241c" stroke-width="3" stroke-linejoin="round"/>
  <!-- neckband -->
  <path d="M33,22 Q50,36 67,22" fill="none" stroke="#7b241c" stroke-width="5" stroke-linecap="round"/>
  <!-- knit texture -->
  <path d="M42,46 L42,72 M50,44 L50,72 M58,46 L58,72" stroke="#96281b" stroke-width="3" stroke-linecap="round"/>
</svg>
