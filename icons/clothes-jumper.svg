<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Knitted pullover. The tells are structural, not colour: a thick ribbed
       neckband, wide ribbed cuffs and hem, cable-knit texture, and no front
       opening at all — that last one is what separates it from the jacket. -->
  <path d="M31,26 Q50,42 69,26 L84,31 L96,68 L80,77 L73,56 L73,88 L27,88 L27,56 L20,77 L4,68 L16,31 Z"
        fill="#b8452f" stroke="#6e2417" stroke-width="4" stroke-linejoin="round"/>
  <!-- cable-knit texture, the clearest "this is knitted" signal -->
  <g fill="none" stroke="#8f3223" stroke-width="3.5" stroke-linecap="round">
    <path d="M41,48 Q50,54 41,60 Q50,66 41,72"/>
    <path d="M59,48 Q50,54 59,60 Q50,66 59,72"/>
  </g>
  <!-- wide ribbed hem -->
  <rect x="27" y="77" width="46" height="11" fill="#8f3223" stroke="#6e2417" stroke-width="3"/>
  <path d="M36,79 L36,86 M45,79 L45,86 M55,79 L55,86 M64,79 L64,86"
        stroke="#6e2417" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ribbed cuffs -->
  <path d="M83,62 L96,68 L80,77 L76,69 Z" fill="#8f3223" stroke="#6e2417" stroke-width="3" stroke-linejoin="round"/>
  <path d="M17,62 L4,68 L20,77 L24,69 Z" fill="#8f3223" stroke="#6e2417" stroke-width="3" stroke-linejoin="round"/>
  <!-- thick ribbed neckband -->
  <path d="M31,26 Q50,42 69,26" fill="none" stroke="#8f3223" stroke-width="9" stroke-linecap="round"/>
  <path d="M31,26 Q50,42 69,26" fill="none" stroke="#6e2417" stroke-width="3" stroke-linecap="round"/>
</svg>
