<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The yellow A-frame board that stands on the floor in Australian shopping
       centres, hospitals and workplaces.

       Four things the previous drawing had wrong. The board is moulded plastic
       and carries no black outline at all, only its own lighter and darker
       yellows. Its feet are a notch cut out of the bottom edge, not two blocks
       stuck under it. The triangle is an outline with the board showing
       through, not a filled panel. And the figure faces the other way: head up
       and to the left, one arm thrown up to the right, both feet shot out to
       the right, which is what a slip looks like.

       The photograph's triangle is about a third of the board and its figure
       about half the triangle. Held to that, at the 86px this renders in a
       question prompt the figure would be 20px and the limbs under 2px, so the
       triangle and the figure are both enlarged within the board. That is the
       one departure; the pose, the proportions of the board and the shape of
       the spill are the photograph's. -->
  <!-- rear panel, folded back behind the front one -->
  <path d="M63,11 L71,11 L87,88 L79,88 Z" fill="#e0ac00"/>
  <!-- front panel: a tapered board with the handle cut through the top and the
       feet notched out of the bottom edge -->
  <path fill="#ffd100" fill-rule="evenodd"
        d="M29,6 L65,6 A3.5,3.5 0 0 1 68.4,8.8 L81.5,88 A3,3 0 0 1 78.5,91.5 L15.5,91.5 A3,3 0 0 1 12.5,88 L25.6,8.8 A3.5,3.5 0 0 1 29,6 Z
           M38,10.5 L56,10.5 A3.4,3.4 0 0 1 56,17.3 L38,17.3 A3.4,3.4 0 0 1 38,10.5 Z
           M34.5,91.5 A14,9 0 0 1 61.5,91.5 Z"/>
  <!-- mouldings: the lip around the handle and the bevel down each edge -->
  <g fill="none" stroke="#e0ac00" stroke-width="1.2" stroke-linecap="round">
    <path d="M34.5,8.6 L59.6,8.6"/>
    <path d="M33.4,19.6 L60.9,19.6"/>
    <path d="M27.9,23 L15.6,86"/>
    <path d="M66.1,23 L78.4,86"/>
  </g>
  <!-- the warning triangle, an outline with the board showing through. Its own
       stroke eats into the usable interior, so every point below clears the
       inner edge rather than the centre line: cleared against the centre line,
       the raised arm came out through the border. -->
  <path d="M48,24 L74,71 L22,71 Z" fill="none" stroke="#1a1a1a"
        stroke-width="3.6" stroke-linejoin="round"/>
  <!-- Going over backwards: head up and to the left, one arm flung up to the
       right and one down to the left, the leading leg shot out to the right
       and the trailing leg dropping to the floor, so the two make a V over the
       spill.

       The limbs are tapered filled shapes ending in a flat foot or hand, not
       round-capped strokes, and they are generated from the joint positions
       and a width at each joint measured off the photograph. As strokes they
       came out as wire at any width that still fitted inside the triangle. -->
  <g fill="#1a1a1a">
    <circle cx="42.7" cy="44.7" r="2.4"/>
    <!-- torso: nearly twice the width of a limb, and short. Drawn at a limb's
         width the body stops reading as a body and the arms take the picture
         over; drawn long it stops reading as someone tipping backwards. -->
    <path d="M40.4,49.2 L43.6,52.3 L47.1,55.2 L50.7,51.4 L47.4,48.1 L44,45.2 Z"/>
    <!-- the arm flung up -->
    <path d="M46.3,48.4 L51.3,46 L53.7,44.5 L51.9,42.1 L50.1,43.8 L45.1,46 Z"/>
    <!-- the arm thrown down, bent at the elbow so the forearm hangs -->
    <path d="M41.5,47.9 L36.8,50.9 L35.8,54.6 L38.6,55.2 L39,52.5 L42.9,50.3 Z"/>
    <!-- the leg that shot out -->
    <path d="M48.2,54.9 L53.5,56.5 L57.5,57.5 L59.4,58.3 L60.2,55.3 L58.1,54.9 L54.3,53.9 L49.2,51.9 Z"/>
    <!-- the leg folding under, foot on the spill -->
    <path d="M47.3,54.8 L50.7,58.4 L53.8,62.4 L57.2,64.1 L58.4,61.3 L55.4,60.2 L52.9,56.6 L49.5,52.8 Z"/>
    <!-- the spill: two lobes, a short one to the left and a long one under the
         feet, the way a puddle spreads. One smooth blob read as a sausage. -->
    <path d="M33.4,63.6 C35.4,62.5 38.2,62.6 40.2,63.4 C42.4,64.3 44.4,64.3 46.6,63.6
             C49.2,62.8 53.2,63 55.6,63.7 C58.2,64.2 59.6,64.8 59,65.5
             C57.4,66.3 53.6,66 50.2,65.8 C46.4,65.6 43.6,66.2 40.4,66.5
             C37.4,66.7 35.2,66.5 33.8,65.8 C32.6,65.2 32.3,64.1 33.4,63.6 Z"/>
  </g>
</svg>
