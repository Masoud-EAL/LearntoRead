<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The yellow A-frame board that actually stands on the floor in Australian
       shopping centres, hospitals and workplaces, rather than the AS 1319
       triangle on its own: handle cut through the top, and the warning
       triangle carried on the face.

       The figure sits inside that triangle now instead of on the bare board,
       and the triangle is the real constraint: its interior is a wedge, so a
       limb drawn out to the side at head height leaves the sign altogether.
       Every point below is inside the wedge with room for half the stroke.
       The board is only gently tapered so the triangle can be large, and the
       figure is low in it, where the width is. -->
  <!-- rear panel, folded back, just showing past the front one -->
  <path d="M68,11 L76,11 L89,90 L79,90 Z" fill="#d9a800" stroke="#1a1a1a"
        stroke-width="3.5" stroke-linejoin="round"/>
  <!-- front panel, with the handle cut through it -->
  <path fill="#ffd100" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round" fill-rule="evenodd"
        d="M28,6 L72,6 A3,3 0 0 1 75,8.6 L88,88 A2.6,2.6 0 0 1 85.4,91 L14.6,91 A2.6,2.6 0 0 1 12,88 L25,8.6 A3,3 0 0 1 28,6 Z
           M38,12.5 L62,12.5 A4.3,4.3 0 0 1 62,21.1 L38,21.1 A4.3,4.3 0 0 1 38,12.5 Z"/>
  <!-- feet -->
  <rect x="11" y="90" width="15" height="6.5" rx="2.8" fill="#1a1a1a"/>
  <rect x="74" y="90" width="15" height="6.5" rx="2.8" fill="#1a1a1a"/>
  <!-- warning triangle on the face -->
  <path d="M50,26 L80,80 L20,80 Z" fill="#ffd100" stroke="#1a1a1a"
        stroke-width="4.5" stroke-linejoin="round"/>
  <!-- the figure going over backwards: body on a diagonal, the leading leg
       thrown out, the trailing leg folded under, both arms up -->
  <circle cx="53" cy="51" r="4.6" fill="#1a1a1a"/>
  <g fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50.5,55 L44,64"/>
    <path d="M44,64 L31,68"/>
    <path d="M44,64 L50,72 L41,75"/>
    <path d="M49,57 L41,52"/>
    <path d="M51,55 L60,51"/>
  </g>
  <!-- the spill underfoot -->
  <path d="M28,77 q6,-3.5 12,0 q6,3.5 12,0 q5,-2.6 10,0" fill="none"
        stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round"/>
</svg>
