<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- bike helmet: compulsory here, so the useful sense is the bike one -->
  <path d="M14,60 Q14,20 50,20 Q86,20 86,60 L86,64 L14,64 Z"
        fill="#16a085" stroke="#0b5345" stroke-width="4" stroke-linejoin="round"/>
  <!-- vents -->
  <path d="M32,32 L28,52 M46,28 L44,52 M60,28 L62,52 M74,34 L76,52"
        stroke="#0b5345" stroke-width="5" stroke-linecap="round"/>
  <!-- rim -->
  <rect x="12" y="60" width="76" height="9" rx="4" fill="#0e6655" stroke="#0b5345" stroke-width="3"/>
  <!-- chin strap -->
  <path d="M22,68 L38,86 M78,68 L62,86" stroke="#2d2a26" stroke-width="4" stroke-linecap="round"/>
  <rect x="36" y="82" width="28" height="8" rx="3" fill="#2d2a26"/>
</svg>
