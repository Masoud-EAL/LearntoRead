<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 100 100">
  <!-- AS 2293 / ISO 7010 E002. The composition is the point and it is easy to
       get wrong: the doorway is a white panel and the running figure is the
       green ground showing through it, not a white figure standing on green.
       His leading hand reaches the door's right edge and both feet cross the
       door altogether, which is what says he is on his way out of it.

       The figure is drawn once and stamped twice: a white copy with a fatter
       stroke, then the green copy over it. Inside the door the white copy is
       invisible; where a foot crosses onto the green it is left showing as the
       keyline that keeps the foot readable. One shape, so the two can never
       drift apart, and the keyline is kept to about half a unit a side: at one
       and a half it doubled the apparent weight of the two limbs that leave
       the door and the man looked like he was lunging.

       Two measured departures from the photograph, both for the size this is
       shown at. The limbs are 5.2 where the photograph's are nearer 3.8, and
       the head is 4.9 where it is nearer 4.2: at 86px in a question prompt the
       true proportions come out as wire. Everything else, the joints, the
       door, the arrow, is where the photograph puts it. -->
  <rect x="0.5" y="11.5" width="99" height="77" rx="9" fill="#fff"/>
  <rect x="3.5" y="14.5" width="93" height="71" rx="7" fill="#00843d"/>
  <!-- the doorway -->
  <rect x="17.5" y="22" width="37" height="60.8" fill="#fff"/>
  <defs>
    <g id="runner">
      <circle cx="40.2" cy="31.1" r="4.9" stroke="none"/>
      <!-- the torso carries its own width: it is a body, not a limb, and it
           never leaves the door so it needs no keyline -->
      <path d="M38.4,37 L36.3,57.2" fill="none" stroke-width="9.4"/>
      <g fill="none">
        <path d="M34.4,38.6 L24.5,40.3 L20.3,46.2"/>
        <path d="M41.8,38.8 L46.8,45.3 L54.5,47.4"/>
        <path d="M36.3,57.2 L36.5,68.2 L45.8,79.3 L49.5,80.6"/>
        <path d="M36.3,57.2 L24.8,64.3 L15.2,65.9 L9.5,68.6"/>
      </g>
    </g>
  </defs>
  <use href="#runner" xlink:href="#runner" fill="#fff" stroke="#fff"
       stroke-width="6.6" stroke-linecap="butt" stroke-linejoin="round"/>
  <use href="#runner" xlink:href="#runner" fill="#00843d" stroke="#00843d"
       stroke-width="5.2" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- direction arrow -->
  <path d="M59.1,45.6 L75.6,45.6 L75.6,36.3 L92.6,50.5 L75.6,64.7 L75.6,56 L59.1,56 Z" fill="#fff"/>
</svg>
