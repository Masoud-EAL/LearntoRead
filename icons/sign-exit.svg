<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- This is the reference photograph itself, cropped, not a redrawing.

       Two rounds of hand-drawn limbs (round-capped strokes, then tapered
       filled shapes) still drifted from the photograph on close comparison:
       the bend of an arm, the width of a leg, how the pieces met each other.
       The photograph does not have that problem, so it is the artwork now.

       The crop is a plain rectangle, tight to the green rounded panel's own
       pixels with a few pixels of margin for its white keyline, found by
       scanning the source image for green pixels rather than picked by eye.
       No transparency: the door and the arrow are white in the photograph
       and are meant to stay opaque white, so nothing here is keyed out.
       Stored as WebP, which the alpha-matted signs need for transparency
       anyway and which compresses this kind of photographic shading far
       smaller than PNG (about a twelfth of the size, tested against this
       file). -->
  <image x="1" y="12.7" width="98" height="74.7"
         href="data:image/webp;base64,"/>
</svg>
