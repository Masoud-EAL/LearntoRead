<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- AS 2293 / ISO 7010 E002 style: green ground, white running figure
       passing through a doorway, with a direction arrow. -->
  <rect x="2" y="20" width="96" height="60" rx="6" fill="#0f8a4a"/>
  <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- torso -->
    <path d="M27,42 L31,55"/>
    <!-- leading leg, bent forward -->
    <path d="M31,55 L38,61 L37,72"/>
    <!-- trailing leg, pushing off behind -->
    <path d="M31,55 L23,61 L15,58"/>
    <!-- leading arm -->
    <path d="M29,46 L37,43"/>
    <!-- trailing arm -->
    <path d="M28,46 L20,50"/>
  </g>
  <circle cx="26" cy="35" r="5.5" fill="#fff"/>
  <!-- doorway the figure is running out through -->
  <path d="M50,26 L66,26 L66,74 L50,74" fill="none" stroke="#fff" stroke-width="4.5"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- direction arrow -->
  <path d="M74,50 L92,50 M85,42 L93,50 L85,58" fill="none" stroke="#fff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
