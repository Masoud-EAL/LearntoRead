        fill="#2c5c8a" stroke="#1b3a58" stroke-width="4" stroke-linejoin="round"/>
  <path d="M65,22 L50,31 L50,86 L72,86 L72,52 L82,68 L95,56 L76,26 Z"
        fill="#356ba0" stroke="#1b3a58" stroke-width="4" stroke-linejoin="round"/>
  <!-- collar -->
