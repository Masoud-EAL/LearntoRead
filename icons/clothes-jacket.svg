<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Zip-up jacket. Read it by the full-length opening: two separate front
       panels split down the middle with a zip and pull tab between them,
       plus a stand-up collar and slanted hip pockets. The jumper has no
       opening; that is the difference that carries in black and white. -->
  <!-- left panel -->
  <path d="M36,24 L50,32 L50,88 L27,88 L27,54 L19,76 L4,68 L18,29 Z"
        fill="#2f6b4f" stroke="#17402e" stroke-width="4" stroke-linejoin="round"/>
  <!-- right panel -->
  <path d="M64,24 L50,32 L50,88 L73,88 L73,54 L81,76 L96,68 L82,29 Z"
        fill="#3a805f" stroke="#17402e" stroke-width="4" stroke-linejoin="round"/>
  <!-- stand-up collar -->
  <path d="M36,24 L50,32 L64,24 L62,13 L38,13 Z"
        fill="#245740" stroke="#17402e" stroke-width="4" stroke-linejoin="round"/>
  <!-- zip tape and teeth -->
  <rect x="46" y="30" width="8" height="58" fill="#e6e6e6" stroke="#17402e" stroke-width="2.5"/>
  <path d="M50,34 L50,86" stroke="#8f949c" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- zip pull -->
  <rect x="44" y="52" width="12" height="10" rx="3" fill="#b0b6bd" stroke="#17402e" stroke-width="3"/>
  <path d="M50,62 L50,69" stroke="#17402e" stroke-width="3" stroke-linecap="round"/>
  <!-- slanted hip pockets -->
  <path d="M32,66 L41,72" stroke="#17402e" stroke-width="4" stroke-linecap="round"/>
  <path d="M68,66 L59,72" stroke="#17402e" stroke-width="4" stroke-linecap="round"/>
</svg>
