<!-- A short, shareable address for solo practice: wordlink.au/solo lands the
     learner straight on the game picker, with no home screen and no room code
     in the way. The game itself lives in game.html — this page only carries
     its own share preview and then hands over. -->
<title>Practise English on Your Own — Free Games for Adult Learners | WordLink</title>
<meta name="description" content="Practise English at your own pace, on your own phone. Free games for adult learners: reading, writing and spelling, listening, speaking, grammar, numbers, time and money, signs, messages and forms. No sign-up, no room code.">
<!-- Search engines should keep indexing the game itself, not this hop. -->
<link rel="canonical" href="https://wordlink.au/game.html">

<meta property="og:type" content="website">
<meta property="og:site_name" content="WordLink">
<meta property="og:locale" content="en_AU">
<meta property="og:url" content="https://wordlink.au/solo">
<meta property="og:title" content="Practise English on Your Own — Free Games for Adult Learners">
<meta property="og:description" content="Practise English at your own pace, on your own phone. Free games for adult learners: reading, writing and spelling, listening, speaking, grammar, numbers, time and money, signs, messages and forms. No sign-up, no room code.">
<meta property="og:image" content="https://wordlink.au/icon-512.png">
<meta name="twitter:card" content="summary">

<!-- The refresh is the fallback for a browser with JavaScript turned off; the
     script below beats it to the punch and uses replace() so Back returns to
     wherever the link was shared, not to this staging post.
     Anything after the ? comes too: /solo?game=clock is the short, shareable
     form of a single game's start screen, and dropping the parameter here
     would land every such link on the picker instead.
     The meta sits in <noscript> so it is the script OR the meta, never both:
     left bare, it fires a second navigation on top of the script's and the
     destination is re-parsed from scratch part-way through loading. -->
<noscript><meta http-equiv="refresh" content="0; url=game.html?mode=solo"></noscript>
<script>
(function(){
  var q=location.search.replace(/^\?/,'');
  location.replace('game.html?mode=solo'+(q?'&'+q:''));
})();
</script>
