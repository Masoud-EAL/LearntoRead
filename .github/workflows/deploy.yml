name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: lastmod dates and the changed-page list come from git
      - name: Date each sitemap entry from git
        run: python3 tools/stamp-sitemap.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
      # Only the pages this push changed. Resubmitting every URL on every push
      # is what Bing asks sites not to do, and it can slow how often Bing
      # crawls the host. A manual run (or a first push) submits them all.
      - name: Ping IndexNow (Bing/Yandex/Seznam) with changed sitemap pages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          key="66529f46ae3b827aaffc07bd282a60e42b56202bf1ea86a118c826e225ef848b"
          if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
          else
            changed=ALL
          fi
          urls=$(python3 tools/stamp-sitemap.py --files | while read -r url file; do
            if [ "$changed" = ALL ] || grep -qxF "$file" <<<"$changed"; then echo "$url"; fi
          done | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().split()))")
          if [ "$urls" = "[]" ]; then echo "No sitemap pages changed; skipping IndexNow."; exit 0; fi
          echo "Submitting: $urls"
          curl -s -o /dev/null -w "IndexNow response: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"wordlink.au\",\"key\":\"$key\",\"keyLocation\":\"https://wordlink.au/$key.txt\",\"urlList\":$urls}"
