<!-- generated by tools/build-links.py — do not edit by hand.
     A short, shareable address: https://wordlink.au/words-1 lands straight on
     Words 1 — Beginner Reading. The page carries its own share preview and then hands over. -->
<title>Words 1 — Beginner Reading | WordLink</title>
<meta name="description" content="Sound out short words, one letter pattern at a time. Free reading practice for adult learners.">
<!-- Self-referential: this short address IS the public address for
     Words 1 — Beginner Reading now — it is what gets shared and what a link preview reads. A
     canonical pointing back at the app would hand every one of these pages
     the app's own single title and description, which is exactly the problem
     they exist to solve. -->
<link rel="canonical" href="https://wordlink.au/words-1">

<meta property="og:type" content="website">
<meta property="og:site_name" content="WordLink">
<meta property="og:locale" content="en_AU">
<meta property="og:url" content="https://wordlink.au/words-1">
<meta property="og:title" content="Words 1 — Beginner Reading">
<meta property="og:description" content="Sound out short words, one letter pattern at a time. Free reading practice for adult learners.">
<meta property="og:image" content="https://wordlink.au/icon-512.png">
<meta name="twitter:card" content="summary">

<!-- The refresh is the fallback for a browser with JavaScript turned off, and
     it lives in <noscript> so it is the script OR the meta, never both: left
     bare, the meta fires a second navigation on top of the script's and the
     destination is re-parsed from scratch part-way through loading.
     replace() so Back returns to wherever the link was shared, not to this
     staging post. Anything after the ? comes along, so /words-1?q=20 works. -->
<noscript><meta http-equiv="refresh" content="0; url=index.html?section=wp1"></noscript>
<script>
(function(){
  var q=location.search.replace(/^\?/,'');
  location.replace('index.html?section=wp1'+(q?'&'+q:''));
})();
</script>
